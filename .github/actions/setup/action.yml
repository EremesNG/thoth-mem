name: Setup workspace
description: Install pinned runtimes and frozen workspace dependencies
inputs:
  node-version:
    description: Node.js version
    default: '22.13'
  registry-url:
    description: Optional npm registry for publication
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
      with:
        run_install: false
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: pnpm
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.10
    - shell: bash
      run: pnpm install --frozen-lockfile
