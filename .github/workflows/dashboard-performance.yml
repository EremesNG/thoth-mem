name: Dashboard performance

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  browser-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run dense atlas performance tests
        run: pnpm run test:browser:performance
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-performance-diagnostics
          path: test-results/browser/
          if-no-files-found: ignore
          retention-days: 14
