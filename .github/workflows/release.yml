name: Release
on:
  push: {tags: ['v*.*.*']}
permissions: {contents: write, id-token: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v6
        with: {run_install: false}
      - uses: actions/setup-node@v6
        with: {node-version: 22.13, registry-url: 'https://registry.npmjs.org/', cache: pnpm}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: 1.3.10}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prepublishOnly
      - run: pnpm run integration:smoke
      - run: pnpm run benchmark:fixture
      - run: npm publish --ignore-scripts
      - env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
