name: Release
on:
  push: {tags: ['v*.*.*']}
permissions: {contents: write, id-token: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v6
        with: {run_install: false}
      - uses: actions/setup-node@v6
        with: {node-version: 22.14, registry-url: 'https://registry.npmjs.org/', cache: pnpm}
      - run: npm install -g npm@11.19.1
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: 1.3.10}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run prepublishOnly
      - run: pnpm run integration:smoke
      - run: pnpm run benchmark:fixture
      - run: npm publish --ignore-scripts
      - name: Create GitHub release
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
      - name: Create marketplace token
        id: marketplace-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.THOTH_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.THOTH_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: thoth-plugins
          permission-contents: write
      - name: Publish marketplace version
        env:
          GH_TOKEN: ${{ steps.marketplace-token.outputs.token }}
        run: |
          gh auth setup-git
          pnpm run release:marketplace
