name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release package
        run: pnpm run prepublishOnly

      - name: Run browser smoke tests
        run: pnpm run test:browser

      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-browser-diagnostics
          path: test-results/browser/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run retrieval eval
        run: pnpm run eval:retrieval

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm tsx scripts/generate-release-notes.ts release-notes.md

      - name: Publish to npm
        run: npm publish --ignore-scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}"
          --verify-tag
          --title "${GITHUB_REF_NAME}"
          --notes-file release-notes.md
