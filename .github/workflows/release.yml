name: Release
on:
  push: {tags: ['v*.*.*']}
permissions: {actions: read, contents: write, id-token: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: ./.github/actions/setup
        with: {node-version: 22.14, registry-url: 'https://registry.npmjs.org/'}
      - run: npm install -g npm@11.19.1
      - run: pnpm run prepublishOnly
      - run: pnpm run integration:smoke
      - run: pnpm run benchmark:fixture
      # Run local build/pack verification first while push CI runs in parallel.
      - name: Wait for CI
        id: wait-ci
        timeout-minutes: 46
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$HEAD_SHA" origin/master; then
            echo "Release tag commit must be contained in origin/master."
            exit 1
          fi

          deadline=$((SECONDS + 2700))
          while (( SECONDS < deadline )); do
            runs=$(timeout 30s gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${HEAD_SHA}&event=push&per_page=100")
            run=$(jq --arg sha "$HEAD_SHA" \
              '.workflow_runs | map(select(.head_branch == "master" and .head_sha == $sha and .event == "push")) | sort_by(.run_number) | last // empty' <<< "$runs")

            if [ -n "$run" ]; then
              status=$(jq -r '.status' <<< "$run")
              conclusion=$(jq -r '.conclusion // empty' <<< "$run")
              run_id=$(jq -er '.id' <<< "$run")
              url=$(jq -r '.html_url' <<< "$run")
              echo "CI: ${status} ${conclusion:-pending} (${url})"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  exit 0
                fi
                echo "CI did not pass: ${conclusion:-unknown}"
                exit 1
              fi

              # Fail early even while the other matrix jobs are still running.
              failed_jobs=$(timeout 30s gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json jobs \
                --jq '.jobs[] | select(.status == "completed") | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out" or .conclusion == "action_required" or .conclusion == "startup_failure" or .conclusion == "stale") | "\(.name): \(.conclusion)"')
              if [ -n "$failed_jobs" ]; then
                echo "$failed_jobs"
                exit 1
              fi
            else
              echo "No master push CI run for ${HEAD_SHA} yet."
            fi
            sleep 10
          done
          echo "Timed out waiting for master push CI for ${HEAD_SHA}."
          exit 1

      - name: Publish to npm
        if: ${{ steps.wait-ci.outcome == 'success' }}
        run: npm publish --ignore-scripts
      - name: Create GitHub release
        if: ${{ steps.wait-ci.outcome == 'success' }}
        env: {GH_TOKEN: '${{ github.token }}'}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
      - name: Create marketplace token
        if: ${{ steps.wait-ci.outcome == 'success' }}
        id: marketplace-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.THOTH_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.THOTH_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: thoth-plugins
          permission-contents: write
      - name: Publish marketplace version
        if: ${{ steps.wait-ci.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.marketplace-token.outputs.token }}
        run: |
          gh auth setup-git
          pnpm run release:marketplace
