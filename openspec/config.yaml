schema: spec-driven

context: |
  Tech stack: strict TypeScript/ESM, Node.js >=22.12.0, SQLite/FTS5 (better-sqlite3), zod, MCP SDK
  Architecture: src/memory-core/ is the SQLite authority; exactly six MCP tools and native OpenCode, Codex, and Claude bundles share one lifecycle core
  Testing: Vitest unit/integration/setup/packaging suites plus disposable packed-plugin smoke and an offline benchmark contract fixture
  Style: no linter; semicolons, single quotes dominant
  CI: GitHub Actions builds, tests, verifies package inventory, and exercises packed release boundaries

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    guidance:
      - Include sequence diagrams for complex flows
      - Document architecture decisions with rationale
    sub_artifacts: false
    complexity_threshold:
      affected_domains: 3
      affected_files: 12
      external_research: true
  tasks:
    guidance:
      - Group tasks by independently testable story
      - Use globally sequential T### identifiers
      - Keep behavior work test-first and name a public verification seam
    traceability: true
    parallel_markers: false
  apply:
    guidance:
      - Follow existing code patterns and conventions
    tdd: true
    test_command: 'pnpm test'
  verify:
    test_command: 'pnpm test'
    build_command: 'pnpm run build'
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
  constitution:
    path: openspec/memory/constitution.md
    enforce_check: true
    version_policy: semver
  consistency:
    enforce_block: true
    require_coverage_percentage: true
  requirements_quality:
    enforce_block: true
    dimensions:
      - completeness
      - clarity
      - measurability
      - testability
  clarification:
    max_markers_per_spec: 3
  handoffs:
    surface_hints: true
